group = 'com.findapptag.findtag_bridge'
version = '0.3.0'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// The official FindTag Android SDK is published only as an AAR file in
// https://github.com/findtag/FindTag_Android_SDK (no Maven artifact). An Ivy
// repository reads it straight from that repository, pinned to a commit so
// the binary cannot change underneath a build. The AAR declares no transitive
// dependencies. Flutter resolves plugin dependencies from the host projects,
// so the repository is registered for every project.
def findTagSdkCommit = 'dba5fbf5601426cd7436ef9fa380355153b3023d' // tag V1_260930
def findTagSdkArtifact = 'sdk-findtag-release_V1_0930'

rootProject.allprojects {
    repositories {
        ivy {
            name = 'findTagGitHub'
            url = uri('https://raw.githubusercontent.com/findtag/FindTag_Android_SDK/')
            patternLayout {
                artifact '[revision]/libs/[artifact].[ext]'
            }
            metadataSources {
                artifact()
            }
            content {
                includeGroup('com.github.findtag')
            }
        }
    }
}

android {
    namespace 'com.findapptag.findtag_bridge'
    compileSdk 36

    defaultConfig {
        minSdk 29
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "com.github.findtag:${findTagSdkArtifact}:${findTagSdkCommit}@aar"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
}
